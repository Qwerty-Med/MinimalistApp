<mat-card class="soft-orange-card">
    <h1 class="alinear">Listado de Evaluaciones</h1>
    <mat-card-header>
        <div>
            <mat-form-field hintLabel="Busque Evaluaciones" appearance="fill">
                <mat-label>Buscar Evaluacion</mat-label>
                <input matInput #input (keyup)="buscar(input.value)">
            </mat-form-field>
        </div>
    </mat-card-header>

    <mat-card-header>
        <div class="right p-2">
            <ul>
                <li>
                    <button mat-raised-button color="primary" (click)="openProductDialog()">Agregar Evaluacion</button>
                </li>
            </ul>
        </div>
    </mat-card-header>

    <div mat-card-image></div>

    <mat-card-content>

    

        <table mat-table [dataSource]="dataSource">
            <!--id column-->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>Nº</th>
                <td mat-cell *matCellDef="let element"> {{element.id}}</td>
            </ng-container>

            <!--id name-->
            <ng-container matColumnDef="tipo">
                <th mat-header-cell *matHeaderCellDef>nombre</th>
                <td mat-cell *matCellDef="let element"> {{element.nombre}}</td>
            </ng-container>

             <ng-container matColumnDef="nota">
                <th mat-header-cell *matHeaderCellDef>Nota</th>
                <td mat-cell *matCellDef="let element"> {{element.nota}}</td>
            </ng-container>

                       <!--id name-->
            <ng-container matColumnDef="materia">
                <th mat-header-cell *matHeaderCellDef>Materia</th>
                <td mat-cell *matCellDef="let element"> {{element.materia}}</td>
            </ng-container>

            

            <!-- price-->
            <ng-container matColumnDef="estudiante">
                <th mat-header-cell *matHeaderCellDef>estudiante</th>
                <td mat-cell *matCellDef="let element"> {{element.estudiante}}</td>
            </ng-container>

 

            <!--actions-->
<ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef class="mat-column-actions">
    Acciones
  </th>
  <td mat-cell *matCellDef="let element" class="mat-column-actions">
    <div class="actions-container">
      <button
        mat-raised-button
        class="btn-editar"
        (click)="edit(
          element.id,
          element.nombre,
          element.nota,
          element.materia,
          element.estudiante
        )"
      >
        Editar
      </button>

      <button
        mat-raised-button
        class="btn-eliminar"
        (click)="delete(element.id)"
      >
        Eliminar
      </button>
    </div>
  </td>
</ng-container>



            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons=""></mat-paginator>

    </mat-card-content>

</mat-card>
