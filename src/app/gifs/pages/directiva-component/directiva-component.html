<mat-card class="soft-orange-card centered-card">
  <div class="page">
    <h1 class="title">Sugerencias para redactar tu carta</h1>
    <br>
    <br><br>
    <div class="container">
      <div class="left">
        <mat-card class="suggestion">
          <div class="suggestion-inner">
            <div class="suggest-text">Inicia tu mensaje con un saludo cordial.</div>
            <button class="heart-toggle1" matButton="filled" disabled>
              <i class="fa-solid fa-heart"></i>
            </button>
          </div>
        </mat-card>

        <mat-card class="suggestion">
          <div class="suggestion-inner">
            <div class="suggest-text">Respeta la postura de los miembros de la institución.</div>
            <button class="heart-toggle1" matButton="filled" disabled>
              <i class="fa-solid fa-heart"></i>
            </button>
          </div>
        </mat-card>

        <mat-card class="suggestion">
          <div class="suggestion-inner">
            <div class="suggest-text">Procura ser breve y conciso en tu escrito.</div>
            <button class="heart-toggle1" matButton="filled" disabled>
              <i class="fa-solid fa-heart"></i>
            </button>
          </div>
        </mat-card>
      </div>
      <form [formGroup]="productForm">
        <div class="right">
          <div class="bubble">
            <div class="bubble-content">
              <label class="bubble-title">Escribe tu carta<br />aquí:</label>
              <mat-form-field appearance="outline" class="textarea-field">
                <textarea matInput placeholder="Redacta tu carta..." rows="8" formControlName="contenido" required ></textarea>
              </mat-form-field>
            </div>
          </div>
        </div>
      </form>

      <div class="boton">
        <div class="right">
          <button mat-button color="primary" mat-raised-button (click)="onSave()">Enviar</button>
        </div>
      </div>

    </div>

  </div>
</mat-card>
