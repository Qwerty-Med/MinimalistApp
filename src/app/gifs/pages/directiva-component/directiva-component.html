<div class="container-fluid mt-4">
  <h2 class="text-center mb-4 text-primary fw-bold">
    Panel de Gestión de la Directiva
  </h2>

  <!-- Información general -->
  <div class="card shadow-sm mb-4">
    <div class="card-body d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <h5 class="card-title text-secondary">Cargo Directiva</h5>
        <p class="fs-5 fw-semibold text-dark">{{ directiva?.cargo }}</p>
      </div>
      <div>
        <button mat-raised-button color="primary" (click)="refreshData()">
          <mat-icon>refresh</mat-icon> Actualizar datos
        </button>
      </div>
    </div>
  </div>

  <!-- Resumen numérico -->
  <div class="row text-center mb-4">
    <div class="col-md-2 col-sm-6 mb-3" *ngFor="let item of resumen">
      <div class="summary-card p-3 rounded shadow-sm">
        <h5 class="fw-bold text-primary">{{ item.label }}</h5>
        <h3 class="fw-bolder text-dark">{{ item.total }}</h3>
      </div>
    </div>
  </div>

  <!-- Gráficos -->
  <div class="row text-center">
    <div class="col-md-6 mb-4">
      <div class="chartContainer shadow p-3 bg-white rounded">
        <h5 class="text-secondary">Resumen General (Gráfico de Barras)</h5>
        <canvas id="canvas-bar"></canvas>
      </div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="chartContainer shadow p-3 bg-white rounded">
        <h5 class="text-secondary">Distribución (Gráfico Circular)</h5>
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>
</div>
