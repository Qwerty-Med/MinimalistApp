<!-- guia-cvo-welcome.component.html -->
<mat-card class="welcome-card">
  <mat-card-header>
    <mat-card-title class="title">
      Bienvenido a <span class="highlight">GuíaCVO</span>!
    </mat-card-title>
    <mat-card-subtitle>
      Tu guía completa para el aprendizaje y seguimiento académico.
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="welcome-text">
      Explora recursos, administra tus materias y mantente al día con tus evaluaciones. 
      Todo en un solo lugar.
    </p>
    <div class="actions-container" style="margin-top: 30px;">
      <!-- Imagen Materias -->
      <a routerLink="/materias" class="icon-link">
        <img src="https://img.icons8.com/color/96/000000/books.png" alt="Materias" style="width: 80px; height: 80px;">
       
      </a>

      <!-- Imagen PAE -->
      <a routerLink="/pae" class="icon-link">
        <img src="https://img.icons8.com/color/96/000000/school.png" alt="PAE" style="width: 80px; height: 80px;">
        
      </a>
    </div>
  </mat-card-content>

  <mat-card-footer class="footer">
    <small>© 2025 GuíaCVO. Todos los derechos reservados.</small>
  </mat-card-footer>
</mat-card>
