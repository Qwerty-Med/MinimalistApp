<mat-card class="soft-orange-card">
    <h1 class="alinear">Listado de Comentarios</h1>
<br>
<br>

<br>
<br>

<br>
<br>

    <div mat-card-image></div>

    <mat-card-content>

    

        <table mat-table [dataSource]="dataSource">
            <!--id column-->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>Nº</th>
                <td mat-cell *matCellDef="let element"> {{element.id}}</td>
            </ng-container>

            <!--id name-->
            <ng-container matColumnDef="contenido">
                <th mat-header-cell *matHeaderCellDef>Contenido</th>
                <td mat-cell *matCellDef="let element"> {{element.contenido}}</td>
            </ng-container>
            <!--actions-->



            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons=""></mat-paginator>

    </mat-card-content>

</mat-card>
