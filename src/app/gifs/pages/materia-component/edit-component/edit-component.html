<h2 mat-dialog-title>{{estadoFormulario}} Materia </h2>

<mat-dialog-content>

    <form [formGroup]="productForm">

        <div class="category-container">
            <mat-form-field>
                <input matInput placeholder="Nombre" formControlName="nombre" required />
            </mat-form-field>

            <mat-form-field>
                <input matInput placeholder="Profesor" formControlName="profesor" required />
            </mat-form-field>

            <mat-form-field>
                <input matInput placeholder="Estudiante" formControlName="estudiante" required />
            </mat-form-field>

            <mat-form-field>
                <input matInput placeholder="Evaluaciones" formControlName="evaluaciones" required />
            </mat-form-field>

         

            <!--
            
            <mat-form-field>
                <mat-label>Categoria</mat-label>
                <mat-select formControlName="category">

                </mat-select>
            </mat-form-field>
          -->

            <!--
            <div>
                <mat-label>Foto:</mat-label>
                <label for="file-upload" class="subir">
                    Subir archivo
                </label>

                <input id="file-upload" accept="image/png, image/jpeg" (change)="onFileChanged($event)" type="file"
                    formControlName="picture" class="input-file" />
                <span>{{nameImg}}</span>
            </div>

          -->
        </div>
    </form>
</mat-dialog-content>

<!--[disabled]="categoryForm.invalid"-->

<mat-dialog-actions>
    <button mat-button color="primary" (click)="onSave()">
        <mat-icon></mat-icon>Guardar
    </button>

    <button mat-button color="primary" (click)="onCancel()">
        <mat-icon></mat-icon>Cancelar
    </button>
</mat-dialog-actions>
