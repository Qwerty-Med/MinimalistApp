
<mat-card class="soft-orange-card">
    <h1 class="alinear">Listado de Materias</h1>
    <mat-card-header>
        <div>
            <mat-form-field hintLabel="Busque productos" appearance="fill">
                <mat-label>Buscar Materias</mat-label>
                <input matInput #input (keyup)="buscar(input.value)">
            </mat-form-field>
        </div>
    </mat-card-header>

    <mat-card-header>
        <div class="right p-2">
            <ul>
                <li>
                    <button mat-raised-button color="primary" (click)="openProductDialog()">Agregar Materia</button>
                </li>
            </ul>
        </div>
    </mat-card-header>

    <div mat-card-image></div>

    <mat-card-content>

    

        <table mat-table [dataSource]="dataSource">
            <!--id column-->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>Nº</th>
                <td mat-cell *matCellDef="let element"> {{element.id}}</td>
            </ng-container>

            <!--id name-->
            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef>Nombre</th>
                <td mat-cell *matCellDef="let element"> {{element.nombre}}</td>
            </ng-container>

            <!-- price-->
            <ng-container matColumnDef="profesor">
                <th mat-header-cell *matHeaderCellDef>Profesor</th>
                <td mat-cell *matCellDef="let element"> {{element.profesor}}</td>
            </ng-container>

            <!-- price-->
            <ng-container matColumnDef="estudiante">
                <th mat-header-cell *matHeaderCellDef>Estudiante</th>
                <td mat-cell *matCellDef="let element"> {{element.estudiante}}</td>
            </ng-container>

            <!-- account-->
            <ng-container matColumnDef="evaluaciones">
                <th mat-header-cell *matHeaderCellDef>Evaluaciones</th>
                <td mat-cell *matCellDef="let element"> {{element.evaluaciones}}</td>
            </ng-container>

            <!-- account-->
            <ng-container matColumnDef="directiva">
                <th mat-header-cell *matHeaderCellDef>Directiva</th>
                <td mat-cell *matCellDef="let element"> {{element.directiva}}</td>
            </ng-container>

    

            <!--actions-->
<ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef class="mat-column-actions">
    Acciones
  </th>
  <td mat-cell *matCellDef="let element" class="mat-column-actions">
    <div class="actions-container">
      <button
        mat-raised-button
        class="btn-editar"
        (click)="edit(
          element.id,
          element.nombre,
          element.profesor,
          element.estudiante,
          element.evaluaciones,
          element.directiva       
        )"
      >
        Editar
      </button>

      <button
        mat-raised-button
        class="btn-eliminar"
        (click)="delete(element.id)"
      >
        Eliminar
      </button>
    </div>
  </td>
</ng-container>



            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons=""></mat-paginator>

    </mat-card-content>

</mat-card>
