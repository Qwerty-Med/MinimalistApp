<mat-card class="soft-orange-card">
    <h1 class="alinear">Listado de Estudiantes</h1>

  <!-- Buscador -->
  <div class="flex justify-between mb-4">
   <mat-card-header>


  <div>
            

      <mat-form-field hintLabel="Busque productos" appearance="fill">
               <mat-label>Buscar Estudiante</mat-label>
      <input
        matInput
        placeholder="Ingrese título o palabra clave"
        [(ngModel)]="searchTerm"
      />
      <button
        *ngIf="searchTerm"
        matSuffix
        mat-icon-button
        aria-label="Clear"
        (click)="searchTerm = ''"
      >
        <mat-icon>close</mat-icon>
      </button>
 </mat-form-field>
      </div>
</mat-card-header>

    <button
      mat-flat-button
      color="primary"
      class="rounded-lg"
      (click)="reloadEncuestas()"
    >
      <mat-icon>refresh</mat-icon>
      Actualizar
    </button>
  </div>
<mat-card-content>
  <!-- Tabla de encuestas -->
  <div class="overflow-x-auto">
    <table mat-table [dataSource]="filteredEncuestas()" class="w-full mat-elevation-z8">

      <!-- Columna: Título -->
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let encuesta">
          {{ encuesta.titulo }}
        </td>
      </ng-container>

      <!-- Columna: Estudiante -->
      <ng-container matColumnDef="estudiante">
        <th mat-header-cell *matHeaderCellDef>Estudiante</th>
        <td mat-cell *matCellDef="let encuesta">
          {{ encuesta.estudiante?.nombre }} {{ encuesta.estudiante?.primerApellido }}
        </td>
      </ng-container>

      <!-- Columna: Directiva -->
      <ng-container matColumnDef="directiva">
        <th mat-header-cell *matHeaderCellDef>Directiva</th>
        <td mat-cell *matCellDef="let encuesta">
          {{ encuesta.directiva?.cargo }}
        </td>
      </ng-container>

      <!-- Columna: Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let encuesta">
          <button
            mat-stroked-button
            color="accent"
            (click)="verDetalles(encuesta)"
          >
            <mat-icon>visibility</mat-icon>
            Ver
          </button>
        </td>
      </ng-container>

      <!-- Header y filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="hover:bg-gray-100 transition"
      ></tr>
    </table>
  </div>

  <!-- Si no hay encuestas -->
  <div *ngIf="filteredEncuestas().length === 0" class="text-center text-gray-500 mt-4">
    <mat-icon>info</mat-icon> No hay encuestas disponibles.
  </div>
  </mat-card-content>
</mat-card>
