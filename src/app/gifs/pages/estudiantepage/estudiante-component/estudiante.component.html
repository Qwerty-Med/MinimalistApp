<h2 mat-dialog-title>{{estadoFormulario}} Estudiante</h2>

<mat-dialog-content>

    <form [formGroup]="productForm">

        <div class="category-container">
            <mat-form-field>
                <input matInput placeholder="Nombre" formControlName="nombre" required />
            </mat-form-field>

            <mat-form-field>
                <input matInput placeholder="Primer Apellido" formControlName="primerApellido" required />
            </mat-form-field>

            <mat-form-field>
                <input matInput placeholder="Segundo Apellido" formControlName="segundoApellido" required />
            </mat-form-field>

            <mat-form-field>
                <input matInput type="number" placeholder="Teléfono" formControlName="telefono" required min="1000000"
                    pattern="[0-9]*" matInput type="number" placeholder="Telefono" formControlName="telefono" required>
                <mat-error *ngIf="productForm.get('telefono')?.invalid">
                    Ingresa un número de teléfono válido
                </mat-error>
            </mat-form-field>

            <mat-form-field>
                <input matInput placeholder="Direccion" formControlName="direccion" required />
            </mat-form-field>

            <mat-form-field>
                <input matInput placeholder="Correo" formControlName="correo" required />
            </mat-form-field>

            <mat-form-field>
                <input matInput placeholder="Materias" formControlName="materias" />
            </mat-form-field>

            <div class="form-field">
                <label class="form-label">PAE</label>
                <mat-checkbox formControlName="pae">Activo</mat-checkbox>
            </div>

       
        </div>
    </form>
</mat-dialog-content>

<!--[disabled]="categoryForm.invalid"-->

<mat-dialog-actions>
    <button mat-button color="primary" (click)="onSave()">
        <mat-icon></mat-icon>Guardar
    </button>

    <button mat-button color="primary" (click)="onCancel()">
        <mat-icon></mat-icon>Cancelar
    </button>
</mat-dialog-actions>
